name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go test ./...

  conformance:
    # The official CWL v1.2 conformance suite, in two stages.
    #
    # Stage 0 is the parse/validate sweep in pkg/cwlcore/conformance, gated at
    # its own ratchet. Stage 1 executes the 378-test suite through cwltest and
    # ratchets the result: it fails only when a test that used to pass stops
    # passing.
    #
    # The `required` subset is deliberately NOT gated yet -- it stands at 59 of
    # 83 -- because a gate we do not meet is a permanently red build, not a
    # signal. Once required reaches 100%, add `-gate-required` to the Stage 1
    # step and this job starts enforcing it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cwltest
        run: pip install cwltest

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # test:conformance:run depends on build and on the Stage 0 sweep, so this
      # one step fetches the pinned corpus, gates Stage 0 and ratchets Stage 1.
      # Many suite documents run `python`, which setup-python puts on PATH.
      - name: Stage 0 + Stage 1 (ratcheted; required subset ungated)
        run: task test:conformance:run

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            .task/conformance/conformance.xml
            .task/conformance/badges
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --max-same-issues 50

      - run: golangci-lint config verify

      - name: go-arch-lint
        run: go run github.com/fe3dback/go-arch-lint@latest check

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: nilaway
        run: >
          go run go.uber.org/nilaway/cmd/nilaway@latest
          -exclude-file-docstrings "Code generated" -exclude-test-files ./...

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: docs:agents:check
        run: task docs:agents:check

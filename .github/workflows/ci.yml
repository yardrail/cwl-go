name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A Docker daemon is a hard dependency of the test suite, not an optional
    # extra: the CommandLineTool container tests fail rather than skip when one
    # is absent, so that "the tests passed" means the same thing everywhere.
    # ubuntu-latest runners ship one already started.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Confirm the Docker daemon is reachable
        run: docker version

      - run: go build ./...
      - run: go test ./...

  conformance:
    # The official CWL v1.2 conformance suite, in two stages.
    #
    # Stage 0 is the parse/validate sweep in pkg/cwlcore/conformance, gated at
    # its own ratchet. Stage 1 executes the suite through cwltest, ratchets the
    # result, and gates the `required` subset at 100%.
    #
    # The suite stands at 378 of 378. The ratchet records the passing ids rather
    # than a count, so it still runs underneath the gate and still has something
    # to say: a count alone lets one test start passing while another stops.
    #
    # -gate-required keys on "zero failures in the required-tagged set", never
    # on a count: one suite entry is tagged `require` (an upstream typo), so
    # --tags required selects 83 of an intended 84, and a hardcoded denominator
    # would break the day upstream fixes the spelling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cwltest
        run: pip install cwltest

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.53.1

      # test:conformance:run depends on build and on the Stage 0 sweep, so this
      # one step fetches the pinned corpus, gates Stage 0 and ratchets Stage 1.
      # Many suite documents run `python`, which setup-python puts on PATH.
      - name: Stage 0 + Stage 1 (ratcheted; required subset gated at 100%)
        run: task test:conformance:run -- -gate-required

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: |
            .task/conformance/conformance.xml
            .task/conformance/badges
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest". This project runs every linter golangci-lint
          # has and bans //nolint, so a floating version can turn the build red
          # with no change to the code -- as it did: a release after this one
          # renamed exhaustruct to exhaustruct_v5, which silently stopped
          # matching the disable list below and switched the linter back on.
          # Upgrading is a deliberate PR that reconciles .golangci.yml with the
          # new names, not something that happens to a Tuesday.
          version: v2.12.2
          args: --max-same-issues 50

      - run: golangci-lint config verify

      - name: go-arch-lint
        run: go run github.com/fe3dback/go-arch-lint@v1.18.0 check

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: nilaway
        run: >
          go run go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a
          -exclude-file-docstrings "Code generated" -exclude-test-files ./...

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.53.1

      - name: docs:agents:check
        run: task docs:agents:check
